<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bistrô Recantinho da Serra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind/output.css">
    <link rel="stylesheet" href="css/styles.css">

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-brand-beige min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md" x-data="loginApp()">
        <div x-show="loading" class="text-center">
            <div class="animate-logo-float mb-6">
                <img src="assets/logo.PNG" alt="Logo" class="w-24 h-24 mx-auto object-contain">
            </div>
            <p class="text-brand-dark">Carregando...</p>
        </div>

        <div x-show="!loading" x-transition class="bg-white rounded-2xl p-8 shadow-sm">
            <div class="text-center mb-6">
                <img src="assets/logo.PNG" alt="Logo" class="w-20 h-20 mx-auto object-contain mb-4">
                <h1 class="text-2xl font-bold text-brand-dark">Bistrô Recantinho da Serra</h1>
                <p class="text-sm text-gray-500 mt-1">Painel Administrativo</p>
            </div>

            <div x-show="error" x-transition
                 class="bg-red-50 border-l-4 border-red-500 p-4 mb-4 rounded">
                <p class="text-sm text-red-700" x-text="error"></p>
            </div>

            <form @submit.prevent="handleLogin()" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-brand-dark mb-2">Email</label>
                    <input type="email" x-model="email" required
                           class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-brand-dark focus:outline-none focus:border-brand-primary transition-colors"
                           placeholder="seu@email.com" autocomplete="email">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-brand-dark mb-2">Senha</label>
                    <input type="password" x-model="password" required
                           class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-brand-dark focus:outline-none focus:border-brand-primary transition-colors"
                           placeholder="Sua senha" autocomplete="current-password">
                </div>

                <button type="submit"
                        :disabled="submitting"
                        class="w-full py-3 bg-brand-primary text-white font-bold rounded-lg hover:bg-brand-maroon transition-colors disabled:opacity-50">
                    <span x-show="!submitting">Entrar</span>
                    <span x-show="submitting">Entrando...</span>
                </button>
            </form>

            <p class="text-xs text-gray-500 text-center mt-6">
                Acesso restrito a administradores e operadores
            </p>
        </div>
    </div>

    <script>
        function loginApp() {
            return {
                email: '',
                password: '',
                error: null,
                loading: true,
                submitting: false,

                init() {
                    auth.onAuthStateChanged((user) => {
                        if (user) {
                            window.location.href = 'admin.html';
                        } else {
                            this.loading = false;
                        }
                    });
                },

                async handleLogin() {
                    this.error = null;
                    this.submitting = true;
                    try {
                        await authService.login(this.email, this.password);
                        window.location.href = 'admin.html';
                    } catch (err) {
                        this.error = authService.state.error;
                    } finally {
                        this.submitting = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
